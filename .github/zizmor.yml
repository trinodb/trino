# Configuration for zizmor, the GitHub Actions security scanner: https://zizmor.sh/
# Rules disabled here are off for the whole repository; findings accepted case by case
# are instead suppressed inline with "# zizmor: ignore[rule-name]" comments in the workflows.
rules:
  # Requires every action to be pinned to a commit SHA. Third-party actions are SHA-pinned,
  # but actions authored by GitHub itself (actions/*) are trusted at version tags and kept
  # current by Dependabot, which this rule's default policy does not allow.
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
