spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.spark_catalog.type=rest
spark.sql.catalog.spark_catalog.uri=http://iceberg-rest:8181
spark.sql.catalog.spark_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.spark_catalog.s3.endpoint=http://floci:4566
spark.sql.catalog.spark_catalog.s3.path-style-access=true
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
; disabling caching allows us to run spark queries interchangeably with trino's
spark.sql.catalog.spark_catalog.cache-enabled=false
