services:
  maven:
    build:
      context: .devcontainer
    image: trino-maven:latest
    working_dir: /workspace
    command: sleep infinity
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: elasticsearch-server
    extra_hosts:
      - elasticsearch-server:host-gateway
    network_mode: host
    volumes:
      - .:/workspace
      - maven-cache:/home/ubuntu/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  maven-cache:
